<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfoPort — Equipment Group</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#006937">

<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InfoPort">

<script>
(function(){
  try{
    var saved = localStorage.getItem('infoport-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
:root{
  --brand:var(--brand);
  --brand-light:var(--brand-light);
  --brand-hover:var(--brand-hover);
  --brand-tint-bg:#e7f3ec;
  --bg:#f5f7fa;
  --card:#ffffff;
  --surface-2:#f2f2f2;
  --text:#333333;
  --text-soft:var(--text-soft)555;
  --muted:var(--muted)888;
  --border:var(--border)eee;
  --danger:var(--danger);
  --danger-tint-bg:#fdeceb;
  --danger-tint-text:#a0221a;
  --amber:var(--amber);
  --warning-tint-bg:#fff6e5;
  --warning-tint-text:#a05a00;
  --success-tint-bg:#e7f8ee;
  --success-tint-text:#00733a;
}
[data-theme="dark"]{
  --brand:#17c46b;
  --brand-light:#2be08a;
  --brand-hover:#0fa057;
  --brand-tint-bg:#173523;
  --bg:#11151a;
  --card:#1a2027;
  --surface-2:#232a32;
  --text:#e7ebee;
  --text-soft:#b7c0c9;
  --muted:#98a3af;
  --border:#323b44;
  --danger:#f85149;
  --danger-tint-bg:#3a1f1e;
  --danger-tint-text:#ff9d94;
  --amber:#f0b429;
  --warning-tint-bg:#3a2f10;
  --warning-tint-text:#f0c15c;
  --success-tint-bg:#123526;
  --success-tint-text:#34d399;
}
[data-theme="dark"] img{filter:brightness(.92)}
.theme-toggle-btn{
  display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:0 0 auto;
  background:rgba(255,255,255,.14);border:none;border-radius:50%;color:#fff;cursor:pointer;
  font-size:1rem;transition:background .15s ease;
}
.theme-toggle-btn:hover{background:rgba(255,255,255,.26)}
input,textarea,select{color:var(--text)}


*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins,sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* NAVBAR */

nav{
background:var(--brand);
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
position:sticky;
top:0;
z-index:999;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo img{
width:50px;
height:50px;
border-radius:50%;
background:rgb(218, 203, 4);
object-fit:cover;
}

.logo h2{
font-size:22px;
}

.nav-link{
display:flex;
align-items:center;
gap:8px;
color:white;
text-decoration:none;
font-size:14px;
font-weight:600;
background:rgba(255,255,255,.14);
padding:10px 18px;
border-radius:20px;
transition:background .15s ease;
white-space:nowrap;
}

.nav-link:hover{
background:rgba(255,255,255,.26);
}

/* HERO */

.hero{

height:420px;

background:

linear-gradient(rgba(0,70,40,.75),

rgba(0,70,40,.75)),

url("assets/ghacem-banner.jpeg");

background-size:cover;

background-position:center;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

color:white;

padding:30px;

}

.hero h1{

font-size:48px;

margin-bottom:20px;

}

.hero p{

font-size:20px;

opacity:.9;

}

/* CONTROLS: search, sort, filter */

.controls{

max-width:1200px;

margin:40px auto 0;

padding:0 20px;

display:flex;

flex-wrap:wrap;

gap:16px;

align-items:center;

justify-content:space-between;

}

.controls-left{

display:flex;

flex-wrap:wrap;

gap:12px;

flex:1;

min-width:260px;

}

.search-box{

position:relative;

flex:1;

min-width:0;

max-width:360px;

}

.search-box i{

position:absolute;

left:16px;

top:50%;

transform:translateY(-50%);

color:var(--muted);

}

.search-box input{

width:100%;

padding:12px 14px 12px 42px;

border:1px solid var(--border);

border-radius:30px;

font-family:inherit;

font-size:16px;

outline:none;

background:white;

transition:.2s;

}

.search-box input:focus{

border-color:var(--brand);

box-shadow:0 0 0 3px rgba(0,105,55,.12);

}

.sort-box select{

padding:12px 16px;

border:1px solid var(--border);

border-radius:30px;

font-family:inherit;

font-size:16px;

background:white;

color:var(--text);

outline:none;

cursor:pointer;

}

.sort-box select:focus{

border-color:var(--brand);

}

.filter-chips{

display:flex;

flex-wrap:wrap;

gap:10px;

}

.filter-chip{

padding:10px 18px;

border-radius:30px;

border:1px solid var(--border);

background:white;

color:var(--text-soft);

font-family:inherit;

font-size:13px;

font-weight:500;

cursor:pointer;

transition:.2s;

white-space:nowrap;

}

.filter-chip:hover{

border-color:var(--brand);

color:var(--brand);

}

.filter-chip.active{

background:var(--brand);

border-color:var(--brand);

color:white;

}

.results-count{

max-width:1200px;

margin:18px auto 0;

padding:0 20px;

color:var(--muted);

font-size:14px;

}

.no-results{

grid-column:1/-1;

text-align:center;

padding:60px 20px;

color:var(--muted);

}

.no-results i{

font-size:40px;

color:var(--border);

margin-bottom:14px;

display:block;

}

@media(max-width:600px){

.controls{

flex-direction:column;

align-items:stretch;

}

.search-box,.sort-box select{

max-width:none;

}

}

/* EQUIPMENT */

.container{

max-width:1200px;

margin:50px auto;

padding:20px;

}

.section-title{

font-size:32px;

margin-bottom:30px;

color:var(--brand);

}

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:30px;

}

.card{

background:white;

border-radius:18px;

overflow:hidden;

box-shadow:0 10px 20px rgba(0,0,0,.08);

transition:.3s;

}

.card:hover{

transform: translateY(-8px) scale(1.02);
box-shadow: 0 18px 35px rgba(0,0,0,.15);

}

.card img{

width:100%;

height:220px;

object-fit:cover;

background:var(--border);

}

.card-content{

padding:22px;

}

.badge{
display:inline-block;
background:var(--brand-light);
color:white;
padding:7px 14px;
border-radius:30px;
font-size:12px;
font-weight:600;
margin-bottom:12px;
}

.card h3{

margin-bottom:10px;

}

.card p{

margin:6px 0;

color:var(--muted);

}

.card a{

display:inline-block;

margin-top:20px;

text-decoration:none;

background:var(--brand);

color:white;

padding:12px 20px;

border-radius:8px;

}

/* FOOTER */

footer{

background:var(--brand);

color:white;

padding:20px;

text-align:center;

margin-top:60px;

}

/* MOBILE */

@media(max-width:768px){

.hero h1{

font-size:32px;

}

nav{

padding:15px;

}

.logo h2{

font-size:18px;

}

.nav-link{

font-size:0;

padding:10px 12px;

gap:0;

}

.nav-link i{

font-size:16px;

}

}


/* ================= QUICK ACTIONS BAR — Take Five + Offline Access ================= */
/* One compact toolbar replaces what used to be two full-height cards. */

.quick-actions-bar{
  max-width:1200px;margin:20px auto 0;padding:10px 16px;
  background:var(--card);border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.05);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
}

.quick-action-group{
  display:flex;align-items:center;gap:10px;flex:1;min-width:260px;padding:4px 0;
}

.quick-action-icon{
  width:32px;height:32px;flex-shrink:0;background:var(--brand);color:#fff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;
}

.quick-action-info{display:flex;flex-direction:column;flex:1;min-width:0;gap:1px;}
.quick-action-label{font-size:13px;font-weight:700;color:var(--text);}
.quick-action-meta{font-size:11px;color:var(--muted);line-height:1.3;}

.quick-action-btns{display:flex;gap:6px;flex-shrink:0;}
.quick-action-btn{
  background:var(--brand);color:#fff;border:1.5px solid var(--brand);padding:8px 14px;border-radius:20px;
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:6px;transition:.2s;
}
.quick-action-btn:hover{background:var(--brand-hover);border-color:var(--brand-hover);}
.quick-action-btn.outline{background:var(--card);color:var(--brand);}
.quick-action-btn.outline:hover{background:var(--brand-tint-bg);}
.quick-action-btn:disabled{background:var(--border);border-color:var(--border);cursor:not-allowed;}

.quick-action-divider{width:1px;align-self:stretch;background:var(--border);margin:2px 4px;}

.qa-progress-wrap{width:100%;margin-top:6px;display:none;}
.qa-progress-wrap.show{display:block;}
.qa-progress-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
.qa-progress-track{background:var(--border);border-radius:20px;height:6px;overflow:hidden;}
.qa-progress-fill{background:var(--brand);height:100%;width:0%;transition:width .2s;}

@media(max-width:700px){
  .quick-actions-bar{flex-direction:column;align-items:stretch;padding:12px 14px;}
  .quick-action-divider{display:none;height:1px;width:100%;margin:4px 0;}
}
@media(max-width:420px){
  .quick-action-group{flex-wrap:wrap;}
  .quick-action-btns{width:100%;}
  .quick-action-btn{flex:1;justify-content:center;}
}

.t5-risk-chip{
  padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;
  text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;
}
.t5-risk-chip.zero{background:var(--brand-light);}
.t5-risk-chip.amber{background:var(--amber);}
.t5-risk-chip.red{background:var(--danger);}
.t5-history-empty{color:var(--muted);font-size:14px;padding:10px 0;}

/* Take Five History modal */
.t5-history-modal{max-width:820px;}
.t5-history-toolbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:14px;border-bottom:2px solid var(--border);
}
.t5-select-all{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);font-weight:600;cursor:pointer;}
.t5-select-all input{width:18px;height:18px;cursor:pointer;}
#t5SelectedCount{font-size:13px;color:var(--muted);flex:1;}
.t5-export-btn{
  background:var(--brand);color:#fff;border:none;padding:11px 20px;border-radius:24px;
  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.2s;
}
.t5-export-btn:disabled{background:var(--border);cursor:not-allowed;}
.t5-export-btn:not(:disabled):hover{background:var(--brand-hover);}

.t5-history-card{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.t5-history-card-head{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;background:var(--card);
}
.t5-history-card-head input[type="checkbox"]{width:18px;height:18px;flex-shrink:0;cursor:pointer;}
.t5-history-card-main{flex:1;min-width:0;}
.t5-history-card-main strong{display:block;color:var(--text);font-size:14px;}
.t5-history-card-main span{color:var(--muted);font-size:12.5px;}
.t5-history-card-chevron{color:var(--muted);transition:transform .2s;flex-shrink:0;}
.t5-history-card.is-open .t5-history-card-chevron{transform:rotate(180deg);}

.t5-history-card-detail{display:none;padding:0 16px 16px;border-top:1px dashed var(--border);}
.t5-history-card.is-open .t5-history-card-detail{display:block;padding-top:14px;}
.t5-history-hazard{padding:10px 0;border-bottom:1px solid var(--border);}
.t5-history-hazard:last-child{border-bottom:none;}
.t5-history-hazard-name{font-weight:600;font-size:13.5px;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.t5-history-hazard-text{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
.t5-history-hazard-text b{color:var(--text);}
.t5-history-no-hazards{color:var(--muted);font-size:13px;padding:10px 0;}

/* ================= PWA INSTALL PROMPT ================= */

#pwaInstallOverlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:2500;align-items:flex-start;justify-content:center;
  padding:30px 16px;overflow-y:auto;
}
#pwaInstallOverlay.is-open{display:flex;}

.pwa-install-modal{max-width:440px;}

.pwa-step{
  display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;
  padding:14px;background:var(--surface-2);border-radius:12px;
}
.pwa-step-num{
  width:28px;height:28px;flex-shrink:0;background:var(--brand);color:#fff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.pwa-step-icon{
  width:36px;height:36px;flex-shrink:0;background:var(--brand-tint-bg);color:var(--brand);
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;
}
.pwa-step-text{flex:1;font-size:14px;color:var(--text);line-height:1.5;padding-top:4px;}
.pwa-step-text b{color:var(--text);}

.pwa-install-native-btn{
  width:100%;background:var(--brand);color:#fff;border:none;padding:15px;
  border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:.2s;
}
.pwa-install-native-btn:hover{background:var(--brand-hover);}

.pwa-note{
  background:var(--warning-tint-bg);color:var(--warning-tint-text);font-size:13px;padding:12px 14px;
  border-radius:10px;margin-bottom:14px;line-height:1.5;
}

.pwa-dont-show{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
  margin-top:18px;cursor:pointer;
}
.pwa-dont-show input{width:16px;height:16px;cursor:pointer;flex-shrink:0;}

#t5Overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:2000;align-items:flex-start;justify-content:center;
  padding:30px 16px;overflow-y:auto;
}
#t5Overlay.is-open{display:flex;}

#t5HistoryOverlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:2000;align-items:flex-start;justify-content:center;
  padding:30px 16px;overflow-y:auto;
}
#t5HistoryOverlay.is-open{display:flex;}

.t5-modal{
  background:var(--card);border-radius:18px;max-width:760px;width:100%;
  overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);margin-bottom:30px;
}
.t5-modal-head{
  background:var(--brand);color:#fff;padding:20px 24px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
}
.t5-modal-head h3{font-size:19px;margin-bottom:4px;}
.t5-modal-head p{font-size:13px;opacity:.9;margin:0;}
.t5-modal-close{
  background:rgba(255,255,255,.18);border:none;color:#fff;
  width:34px;height:34px;border-radius:50%;flex-shrink:0;cursor:pointer;font-size:15px;
}
.t5-modal-body{padding:22px 24px;max-height:75vh;overflow-y:auto;}

.t5-field{margin-bottom:16px;}
.t5-field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
.t5-field input{
  width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
  font-family:inherit;font-size:16px;outline:none;transition:.2s;
}
.t5-field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,105,55,.12);}
.t5-field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.t5-field-row{grid-template-columns:1fr;}}

.t5-progress-wrap{margin:18px 0;}
.t5-progress-label{font-size:13px;color:var(--muted);margin-bottom:6px;}
.t5-progress-track{background:var(--border);border-radius:20px;height:8px;overflow:hidden;}
.t5-progress-fill{background:var(--brand);height:100%;width:0%;transition:width .2s;}

.t5-category{margin-bottom:22px;}
.t5-category-title{
  font-size:14px;font-weight:700;color:var(--brand);text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border);
}

.t5-hazard-row{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:.2s;}
.t5-hazard-row.answered-yes{border-color:var(--amber);background:var(--warning-tint-bg);}
.t5-hazard-row.answered-no{border-color:var(--brand-tint-bg);background:var(--brand-tint-bg);}

.t5-hazard-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.t5-hazard-name{font-weight:600;font-size:14.5px;color:var(--text);flex:1;min-width:160px;}

.t5-yn{display:flex;gap:8px;}
.t5-yn button{
  border:1px solid var(--border);background:var(--card);color:var(--muted);padding:8px 16px;border-radius:20px;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
}
.t5-yn button.active-yes{background:var(--amber);border-color:var(--amber);color:#fff;}
.t5-yn button.active-no{background:var(--border);border-color:var(--border);color:var(--text);}

.t5-hazard-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.t5-hazard-detail.is-open{display:block;}
.t5-hazard-detail textarea{
  width:100%;min-height:56px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font-family:inherit;font-size:16px;margin-bottom:10px;resize:vertical;
}
.t5-risk-select{display:flex;gap:8px;flex-wrap:wrap;}
.t5-risk-select button{
  flex:1;min-width:110px;border:2px solid var(--border);background:var(--card);padding:10px;border-radius:10px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;color:var(--muted);
}
.t5-risk-select button[data-risk="zero"].selected{background:var(--brand-light);border-color:var(--brand-light);color:#fff;}
.t5-risk-select button[data-risk="amber"].selected{background:var(--amber);border-color:var(--amber);color:#fff;}
.t5-risk-select button[data-risk="red"].selected{background:var(--danger);border-color:var(--danger);color:#fff;}

.t5-overall-banner{display:none;padding:14px 18px;border-radius:12px;margin:18px 0;align-items:center;gap:12px;font-size:14px;font-weight:600;}
.t5-overall-banner.show{display:flex;}
.t5-overall-banner.zero{background:var(--success-tint-bg);color:var(--success-tint-text);}
.t5-overall-banner.amber{background:var(--warning-tint-bg);color:var(--warning-tint-text);}
.t5-overall-banner.red{background:var(--danger-tint-bg);color:var(--danger-tint-text);}

.t5-submit-btn{
  width:100%;background:var(--brand);color:#fff;border:none;padding:15px;border-radius:12px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;transition:.2s;
}
.t5-submit-btn:disabled{background:var(--border);cursor:not-allowed;}
.t5-submit-btn:not(:disabled):hover{background:var(--brand-hover);}

.t5-error{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em;}
.t5-success{display:none;text-align:center;padding:30px 10px;}
.t5-success.show{display:block;}
.t5-success i{font-size:46px;color:var(--brand-light);margin-bottom:14px;}
.t5-success h4{color:var(--brand);margin-bottom:8px;}
.t5-success p{color:var(--muted);font-size:14px;}
.t5-success-actions{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;
}
.t5-success-actions button{
  background:var(--brand);color:#fff;border:none;padding:12px 24px;
  border-radius:30px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.t5-secondary-btn{background:var(--card) !important;color:var(--brand) !important;border:1.5px solid var(--brand) !important;}

@media(max-width:600px){
  #t5Overlay,#t5HistoryOverlay{padding:0;}
  .t5-modal{max-width:none;width:100%;min-height:100%;border-radius:0;margin-bottom:0;}
  .t5-modal-head{padding:16px 18px;}
  .t5-modal-head h3{font-size:16px;}
  .t5-modal-head p{font-size:12px;}
  .t5-modal-body{padding:16px;max-height:none;}

  .t5-hazard-row{padding:12px;}
  .t5-hazard-name{font-size:14px;min-width:0;flex-basis:100%;}
  .t5-yn{width:100%;}
  .t5-yn button{flex:1;text-align:center;}

  .t5-risk-select{flex-direction:column;}
  .t5-risk-select button{min-width:0;width:100%;}

  .t5-history-toolbar{flex-direction:column;align-items:stretch;gap:10px;}
  .t5-export-btn{justify-content:center;}
  .t5-history-card-head{flex-wrap:wrap;}
  .t5-history-card-main{flex-basis:100%;order:1;}

  /* Install prompt stays a small centered popup on phones — it's just a
     few short steps, not the multi-page content the rule above is for. */
  #pwaInstallOverlay{align-items:center;padding:16px;}
  .pwa-install-modal{
    max-width:400px;width:100%;min-height:0;border-radius:18px;margin-bottom:0;
  }
  .pwa-install-modal .t5-modal-head{border-radius:18px 18px 0 0;}
}

@media(max-width:400px){
  .t5-modal-head{flex-wrap:wrap;}
  .t5-modal-close{margin-left:auto;}
}
#offlineBanner{
  display:none;position:fixed;top:0;left:0;right:0;z-index:3000;
  background:var(--danger);color:#fff;text-align:center;
  padding:9px 12px;font-family:'Poppins',Arial,sans-serif;font-size:13px;font-weight:600;
}
#offlineBanner.show{display:block;}
</style>

</head>

<body>

<div id="offlineBanner">You're offline — showing the last saved data.</div>

<nav>
<div class="logo">
<img src="assets/logo.png">
<h2>InfoPort</h2>
</div>
<div>
<button type="button" id="themeToggleBtn" class="theme-toggle-btn" title="Toggle dark mode" style="margin-right:10px;"><i class="fa-solid fa-moon"></i></button>
<a href="index.html" class="nav-link" title="Back to Dashboard" aria-label="Back to Dashboard"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
</div>
</nav>

<section class="hero">
<div>
<h1 id="groupTitle">Equipment Group</h1>
<p id="groupSubtitle">Equipment in this group</p>
</div>
</section>

<div class="controls">
<div class="controls-left">
<div class="search-box">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" id="searchInput" placeholder="Search by name, ID, or manufacturer…">
</div>
<div class="sort-box">
<select id="sortSelect">
<option value="name-asc">Sort: Name (A–Z)</option>
<option value="name-desc">Sort: Name (Z–A)</option>
<option value="id-asc">Sort: ID (A–Z)</option>
<option value="id-desc">Sort: ID (Z–A)</option>
</select>
</div>
</div>
</div>

<p class="results-count" id="resultsCount"></p>

<div class="container">
<div class="cards" id="cardsGrid"><p class="loading-text" style="padding:30px;color:#888;grid-column:1/-1;text-align:center;">Loading equipment…</p></div>
</div>

<footer>
GHACEM LTD © 2026
<br>
Engineering Documentation Portal
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBS3ZZWSUoquqAiPTU0PaUGGh0d8Iwd27U",
  authDomain: "edp-equipment.firebaseapp.com",
  projectId: "edp-equipment",
  storageBucket: "edp-equipment.firebasestorage.app",
  messagingSenderId: "556924119553",
  appId: "1:556924119553:web:55b229fc6c6089b708ee00",
  measurementId: "G-YGXNH7T0T0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
  if (err.code === 'failed-precondition') {
    console.warn('Offline persistence only works in one browser tab at a time.');
  } else if (err.code === 'unimplemented') {
    console.warn('This browser does not support offline persistence.');
  }
});

function escapeHtmlCard(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>

<script>
// ---------- Dark mode ----------
(function(){
  var THEME_KEY = 'infoport-theme';
  var toggleBtn = document.getElementById('themeToggleBtn');

  function applyIcon(theme) {
    if (!toggleBtn) return;
    toggleBtn.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
  }
  applyIcon(document.documentElement.getAttribute('data-theme') || 'light');

  if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
      applyIcon(next);
    });
  }

  var hasManualChoice = false;
  try { hasManualChoice = !!localStorage.getItem(THEME_KEY); } catch(e) {}
  if (!hasManualChoice && window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      var theme = e.matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      applyIcon(theme);
    });
  }
})();

(function () {
  const groupName = new URLSearchParams(window.location.search).get('group') || '';
  document.getElementById('groupTitle').textContent = groupName || 'Equipment Group';
  document.getElementById('groupSubtitle').textContent = groupName
    ? `All equipment listed under "${groupName}"`
    : 'No group specified';
  document.title = groupName ? `InfoPort — ${groupName}` : 'InfoPort — Equipment Group';
})();

(async function () {
  const cardsGrid = document.getElementById('cardsGrid');
  const searchInput = document.getElementById('searchInput');
  const sortSelect = document.getElementById('sortSelect');
  const resultsCount = document.getElementById('resultsCount');

  const groupName = new URLSearchParams(window.location.search).get('group') || '';

  if (!groupName) {
    cardsGrid.innerHTML = `
      <div class="no-results">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p>No group specified. Go back to the dashboard and tap a group tile.</p>
      </div>
    `;
    resultsCount.textContent = 'Showing 0 of 0 equipment';
    return;
  }

  // ---------- Load equipment from Firestore, filtered to this group ----------
  // "Ungrouped" is the dashboard's fallback bucket for equipment with no
  // Group field set, so match that the same way here.
  let equipmentData = [];
  try {
    const [equipSnap, groupQuery] = await Promise.all([
      db.collection('equipment').orderBy('name').get(),
      db.collection('groups').where('name', '==', groupName).limit(1).get().catch(() => null),
    ]);
    const all = equipSnap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
    equipmentData = all.filter((e) => ((e.group && e.group.trim()) || 'Ungrouped') === groupName);

    const groupImage = groupQuery && !groupQuery.empty ? groupQuery.docs[0].data().image : '';
    if (groupImage) {
      document.querySelector('.hero').style.cssText += `background-image:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url('${groupImage}');background-size:cover;background-position:center;`;
    }
  } catch (err) {
    console.error('Failed to load equipment list', err);
  }

  if (!equipmentData.length) {
    cardsGrid.innerHTML = `
      <div class="no-results">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p>No equipment found in this group.</p>
      </div>
    `;
    resultsCount.textContent = 'Showing 0 of 0 equipment';
    return;
  }

  cardsGrid.innerHTML = equipmentData.map((e) => `
    <div class="card">
      <img src="${escapeHtmlCard(e.image || '')}" alt="${escapeHtmlCard(e.name || e.id)}" onerror="this.style.display='none'">
      <div class="card-content">
        <span class="badge">${escapeHtmlCard(e.status || 'Unknown')}</span>
        <h3>${escapeHtmlCard(e.name || e.id)}</h3>
        <p><strong>ID:</strong> ${escapeHtmlCard(e.id)}</p>
        <p><strong>Manufacturer:</strong> ${escapeHtmlCard(e.manufacturer || '—')}</p>
        <p><strong>Location:</strong> ${escapeHtmlCard(e.department || '—')}</p>
        <a href="equipment.html?id=${encodeURIComponent(e.id)}&group=${encodeURIComponent(groupName)}">View Details</a>
      </div>
    </div>
  `).join('');

  const cards = Array.from(cardsGrid.querySelectorAll('.card')).map((el, i) => ({
    el,
    name: (equipmentData[i].name || equipmentData[i].id || '').toLowerCase(),
    id: (equipmentData[i].id || '').toLowerCase(),
    searchText: `${equipmentData[i].name || ''} ${equipmentData[i].id || ''} ${equipmentData[i].manufacturer || ''}`.toLowerCase(),
  }));

  function applyFiltersAndSort() {
    const query = searchInput.value.trim().toLowerCase();
    const visible = cards.filter(c => !query || c.searchText.includes(query));

    const [key, dir] = sortSelect.value.split('-');
    visible.sort((a, b) => {
      const av = key === 'id' ? a.id : a.name;
      const bv = key === 'id' ? b.id : b.name;
      const cmp = av.localeCompare(bv, undefined, { numeric: true, sensitivity: 'base' });
      return dir === 'desc' ? -cmp : cmp;
    });

    cards.forEach(c => { c.el.style.display = 'none'; });
    const existingEmptyState = cardsGrid.querySelector('.no-results');
    if (existingEmptyState) existingEmptyState.remove();

    if (visible.length === 0) {
      cardsGrid.insertAdjacentHTML('beforeend', `
        <div class="no-results">
          <i class="fa-solid fa-magnifying-glass"></i>
          <p>No equipment matches your search.</p>
        </div>
      `);
    } else {
      visible.forEach(c => {
        c.el.style.display = '';
        cardsGrid.appendChild(c.el);
      });
    }

    resultsCount.textContent = `Showing ${visible.length} of ${cards.length} equipment`;
  }

  searchInput.addEventListener('input', applyFiltersAndSort);
  sortSelect.addEventListener('change', applyFiltersAndSort);

  applyFiltersAndSort();
})();
</script>

</body>
</html>
